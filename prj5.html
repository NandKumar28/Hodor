<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Encryptor & Decryptor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030712; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
        }
        
        /* 3D Canvas fixed to background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .cyber-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.8);
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .btn-cyber {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
        .btn-cyber:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <canvas id="bg-canvas"></canvas>

    <div class="glass-panel w-full max-w-3xl rounded-2xl p-8 space-y-6">
        
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 text-center mb-6 tracking-wide drop-shadow-lg">
            File Encryptor & decryptor
        </h1>
        
        <div class="space-y-2">
            <label class="text-sm font-semibold text-purple-300 tracking-wider uppercase">Target Data</label>
            <div class="w-full cyber-input rounded-lg p-6 text-center hover:border-purple-400 transition-colors cursor-pointer group" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" class="hidden" onchange="updateFileName()" />
                <span id="fileNameDisplay" class="text-cyan-300 font-mono group-hover:text-purple-300 transition-colors">📁 Click to browse nodes...</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-sm font-semibold text-purple-300 tracking-wider uppercase">Cipher Matrix</label>
                <select id="algorithm" class="w-full cyber-input rounded-lg p-3 text-white outline-none">
                    <option value="AES">AES-256 (Military Grade)</option>
                    <option value="DES">Triple DES (Legacy)</option>
                </select>
            </div>
            
            <div class="space-y-2">
                <label class="text-sm font-semibold text-purple-300 tracking-wider uppercase">Encryption Key</label>
                <div class="flex space-x-2">
                    <input type="password" id="secretKey" class="w-full cyber-input rounded-lg p-3 text-white outline-none font-mono" placeholder="Enter or generate key..." />
                    <button onclick="generateKey()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 rounded-lg font-bold transition-colors shadow-[0_0_10px_rgba(139,92,246,0.4)]" title="Auto Generate Key">
                        ⚡
                    </button>
                </div>
            </div>
        </div>

        <div class="flex space-x-4 pt-4">
            <button onclick="processFile('encrypt')" class="btn-cyber flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-3 rounded-lg border border-cyan-400/50">
                🔒 ENCRYPT
            </button>
            <button onclick="processFile('decrypt')" class="btn-cyber flex-1 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 rounded-lg border border-purple-400/50">
                🔓 DECRYPT
            </button>
        </div>

        <div class="space-y-2 pt-4 border-t border-slate-700/50">
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-widest">System Status</label>
            <input type="text" id="statusOutput" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-cyan-400 outline-none shadow-inner text-center font-mono text-sm" readonly value="System initialized. Awaiting parameters." />
        </div>
    </div>

    <script>
        // --- 1. UI LOGIC & ENCRYPTION ---
        let currentFile = null;

        function updateFileName() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                currentFile = fileInput.files[0];
                document.getElementById('fileNameDisplay').innerText = "Data Loaded: " + currentFile.name;
                document.getElementById('statusOutput').value = "File mapped to memory. Ready to process.";
            }
        }

        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
            let key = "";
            for (let i = 0; i < 24; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const keyInput = document.getElementById('secretKey');
            keyInput.type = "text"; // Reveal the key temporarily so the user can copy it
            keyInput.value = key;
            document.getElementById('statusOutput').value = "Secure 24-char key generated. SAVE THIS KEY!";
            
            // Hide it again after 5 seconds
            setTimeout(() => {
                keyInput.type = "password";
            }, 5000);
        }

        function processFile(action) {
            const key = document.getElementById('secretKey').value;
            const alg = document.getElementById('algorithm').value;
            const statusBox = document.getElementById('statusOutput');

            if (!currentFile) return alert("Please select a file first!");
            if (!key) return alert("Please enter or generate an encryption key!");

            statusBox.value = "Processing matrix... Please wait.";
            const reader = new FileReader();

            // ENCRYPT
            if (action === 'encrypt') {
                reader.onload = function(e) {
                    try {
                        const fileData = e.target.result;
                        let encryptedData = '';

                        if (alg === 'AES') encryptedData = CryptoJS.AES.encrypt(fileData, key).toString();
                        if (alg === 'DES') encryptedData = CryptoJS.TripleDES.encrypt(fileData, key).toString();

                        const blob = new Blob([encryptedData], { type: 'text/plain' });
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = "SECURE_" + currentFile.name + ".enc";
                        link.click();

                        statusBox.value = "Success: Payload encrypted and exported.";
                    } catch (error) {
                        statusBox.value = "CRITICAL ERROR during encryption.";
                    }
                };
                reader.readAsDataURL(currentFile);
            } 
            // DECRYPT
            else if (action === 'decrypt') {
                if (!currentFile.name.endsWith('.enc')) {
                    return alert("Target must be a .enc file.");
                }

                reader.onload = function(e) {
                    try {
                        const encryptedText = e.target.result;
                        let decryptedData = '';

                        if (alg === 'AES') decryptedData = CryptoJS.AES.decrypt(encryptedText, key).toString(CryptoJS.enc.Utf8);
                        if (alg === 'DES') decryptedData = CryptoJS.TripleDES.decrypt(encryptedText, key).toString(CryptoJS.enc.Utf8);

                        if (!decryptedData) throw new Error("Invalid decryption key or algorithm.");

                        const link = document.createElement('a');
                        link.href = decryptedData; 
                        link.download = "RESTORED_" + currentFile.name.replace('.enc', '').replace('SECURE_', '');
                        link.click();

                        statusBox.value = "Success: Data structure restored.";
                    } catch (error) {
                        statusBox.value = "ACCESS DENIED: Invalid key or algorithm.";
                    }
                };
                reader.readAsText(currentFile);
            }
        }

        // --- 2. THREE.JS 3D BACKGROUND SCENE ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        // Add subtle fog to the scene for depth
        scene.fog = new THREE.FogExp2(0x030712, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 1. Core Rotating Object (Icosahedron)
        const coreGeo = new THREE.IcosahedronGeometry(8, 1);
        const coreMat = new THREE.MeshBasicMaterial({ 
            color: 0x8b5cf6, // Purple
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        // Inner Core
        const innerGeo = new THREE.IcosahedronGeometry(5, 0);
        const innerMat = new THREE.MeshBasicMaterial({ 
            color: 0x06b6d4, // Cyan
            wireframe: true,
            transparent: true,
            opacity: 0.5
        });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerCore);

        // 2. Floating Data Nodes (Particles)
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 700;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Spread particles over a wide area
            posArray[i] = (Math.random() - 0.5) * 100;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x06b6d4,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        // Mouse Interactivity (Parallax Effect)
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate Cores
            core.rotation.y += 0.002;
            core.rotation.x += 0.001;
            innerCore.rotation.y -= 0.003;
            innerCore.rotation.z -= 0.002;

            // Animate Particles slowly floating
            particlesMesh.rotation.y = elapsedTime * 0.05;

            // Parallax Camera movement based on mouse
            camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 10 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
